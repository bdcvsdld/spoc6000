<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKLapp6000</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Kanit', sans-serif; }
        .spa-page { display: none; animation: fadeIn 0.3s ease-in-out; }
        .spa-page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Loader Overlay */
        #globalLoader {
            position: fixed; inset: 0; background: rgba(255, 255, 255, 0.8); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; display: none;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<link rel="icon" type="image/png" href="ลิงก์รูปโลโก้ของคุณ">
    <div id="globalLoader">
        <div class="spinner mb-4"></div>
        <p id="loaderText" class="font-semibold text-blue-600">กำลังประมวลผล...</p>
    </div>

    <div id="pageLogin" class="spa-page active flex items-center justify-center h-screen px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-slate-100">
            <div class="text-center mb-6">
                <i data-lucide="shield-check" class="w-12 h-12 text-blue-600 mx-auto mb-2"></i>
                <h1 class="text-2xl font-bold text-blue-600">TKLapp</h1>
                <p class="text-sm text-slate-500">เข้าสู่ระบบจัดการข้อมูล</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="loginUser" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="ชื่อผู้ใช้งาน">
                <input type="password" id="loginPass" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="รหัสผ่าน">
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl transition-all shadow-md">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>

    <div id="pageMain" class="spa-page max-w-5xl mx-auto p-4 md:py-8">
        
        <header class="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-6 border-l-4 border-blue-500 gap-4">
            <div class="flex items-center gap-2">
                <i data-lucide="activity" class="text-blue-500"></i>
                <h2 class="text-lg font-bold">ระบบเฝ้าระวังโรคระบาดสัตว์</h2>
            </div>
            <div class="flex items-center gap-4">
                <span id="currentUserDisplay" class="text-sm font-semibold text-slate-600"></span>
                <button onclick="logout()" class="text-rose-500 hover:text-rose-700 text-sm font-bold flex items-center gap-1">
                    <i data-lucide="log-out" class="w-4 h-4"></i> ออกจากระบบ
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-5 rounded-2xl shadow-md text-white">
                <div class="flex justify-between items-center mb-2"><p class="opacity-90">รายงานทั้งหมด</p><i data-lucide="file-text" class="opacity-50"></i></div>
                <h4 id="dash-total" class="text-4xl font-bold">0</h4>
            </div>
            <div class="bg-gradient-to-br from-emerald-500 to-emerald-600 p-5 rounded-2xl shadow-md text-white">
                <div class="flex justify-between items-center mb-2"><p class="opacity-90">เกษตรกร</p><i data-lucide="users" class="opacity-50"></i></div>
                <h4 id="dash-farmers" class="text-4xl font-bold">0</h4>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-md border">
                <h3 class="text-sm font-bold text-slate-500 mb-2">ข้อมูลล่าสุด</h3>
                <div id="recentRecords" class="text-sm space-y-2">-- ไม่มีข้อมูล --</div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100">
            <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                <i data-lucide="edit" class="w-5 h-5 text-blue-500"></i> บันทึกข้อมูลใหม่
            </h3>
            
            <form id="dataForm" onsubmit="submitForm(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">วันที่บันทึก</label>
                        <input type="date" id="record_date" class="w-full px-4 py-2 border rounded-xl" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">เลขบัตรประจำตัวประชาชน</label>
                        <input type="text" id="id_card" class="w-full px-4 py-2 border rounded-xl" maxlength="13" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">ชื่อเกษตรกร</label>
                        <input type="text" id="farmer_name" class="w-full px-4 py-2 border rounded-xl" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">ชนิดสัตว์ที่ตรวจ</label>
                        <select id="visited_animals" class="w-full px-4 py-2 border rounded-xl bg-white" required>
                            <option value="">-- เลือก --</option>
                            <option value="สัตว์ปีก">สัตว์ปีก</option>
                            <option value="โคเนื้อ">โคเนื้อ</option>
                            <option value="สุกร">สุกร</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">รูปภาพประกอบ (จะถูกบีบอัดอัตโนมัติ)</label>
                    <input type="file" id="image_upload" accept="image/*" class="w-full px-4 py-2 border rounded-xl bg-slate-50">
                    <div id="image_preview_container" class="mt-2 hidden">
                        <img id="image_preview" class="h-32 rounded-xl object-cover shadow-sm border" 
                            onerror="this.onerror=null; this.outerHTML='<span class=\'text-[10px] text-rose-500 bg-rose-50 px-1 rounded\'>รูปเสีย</span>'"
                    </div>
                </div>

                <div class="pt-4 border-t">
                    <button type="submit" class="w-full md:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all">
                        🚀 ส่งข้อมูลเข้าระบบ
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // กำหนดให้ Icon แสดงผล
        lucide.createIcons();

        // ==========================================
        // 1. ตั้งค่า Supabase Client (ห้ามใช้ชื่อตัวแปร supabase)
        // ==========================================
        const SUPABASE_URL = 'https://xvufztfhscropgmlqnes.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MWz-nLOumcv4ko_qjw0e9Q_b42yllWH';
        const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ตัวแปร State
        let currentUser = null;

        // ==========================================
        // 2. ฟังก์ชัน UI & Loader
        // ==========================================
        function showLoader(text = 'กำลังประมวลผล...') {
            document.getElementById('loaderText').innerText = text;
            document.getElementById('globalLoader').style.display = 'flex';
        }
        function hideLoader() { document.getElementById('globalLoader').style.display = 'none'; }

        function navigate(pageId) {
            document.querySelectorAll('.spa-page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // ==========================================
        // 3. ระบบ Authentication (อิงจากตาราง users ของเราเอง)
        // ==========================================
        async function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            if (!user || !pass) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบ', 'warning');

            showLoader('ตรวจสอบสิทธิ์...');
            
            // Query ข้อมูลจากตาราง users (ไม่ต้องใช้ Auth ของ Supabase ตามโครงสร้างเดิม)
            const { data, error } = await dbClient
                .from('users')
                .select('*')
                .eq('username', user)
                .eq('password', pass)
                .single();

            hideLoader();

            if (error || !data) {
                Swal.fire('ผิดพลาด', 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
            } else {
                currentUser = data;
                document.getElementById('currentUserDisplay').innerText = `👤 ${data.username} (${data.province})`;
                navigate('pageMain');
                loadDashboard();
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            // ลบค่าแทนการรีโหลด
            document.getElementById('dataForm').reset();
            document.getElementById('image_preview_container').classList.add('hidden');
            navigate('pageLogin');
        }

        // ==========================================
        // 4. บีบอัดภาพด้วย Canvas (Image Compression)
        // ==========================================
        async function compressImage(file, maxWidth = 1024) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((maxWidth / width) * height);
                            width = maxWidth;
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                        }, 'image/jpeg', 0.7); // ลดคุณภาพเหลือ 70%
                    };
                };
            });
        }

        // ==========================================
        // 5. อัปโหลดภาพไปยัง Supabase Storage
        // ==========================================
        async function uploadToSupabase(file) {
            const fileName = `img_${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;
            const { data, error } = await dbClient.storage
                .from('tkl_uploads')
                .upload(fileName, file, { cacheControl: '3600', upsert: false });

            if (error) throw error;

            // ดึง Public URL ของภาพ
            const { data: publicUrlData } = dbClient.storage.from('tkl_uploads').getPublicUrl(fileName);
            return publicUrlData.publicUrl;
        }

        // Preview ภาพเมื่อผู้ใช้เลือกไฟล์
        document.getElementById('image_upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                document.getElementById('image_preview').src = URL.createObjectURL(file);
                document.getElementById('image_preview_container').classList.remove('hidden');
            }
        });

        // ==========================================
        // 6. ฟังก์ชัน Submit Form (บันทึกข้อมูล)
        // ==========================================
        async function submitForm(e) {
            e.preventDefault();
            showLoader('กำลังบันทึกข้อมูล...');

            try {
                let imageUrl = null;
                const fileInput = document.getElementById('image_upload').files[0];
                
                if (fileInput) {
                    showLoader('กำลังบีบอัดและอัปโหลดภาพ...');
                    const compressedFile = await compressImage(fileInput);
                    imageUrl = await uploadToSupabase(compressedFile);
                }

                showLoader('อัปเดตฐานข้อมูล...');
                const payload = {
                    record_date: document.getElementById('record_date').value,
                    reporter_name: currentUser.username,
                    id_card: document.getElementById('id_card').value,
                    farmer_name: document.getElementById('farmer_name').value,
                    visited_animals: document.getElementById('visited_animals').value,
                    image_1: imageUrl
                };

                const { data, error } = await dbClient.from('reports').insert([payload]);
                
                if (error) throw error;

                hideLoader();
                Swal.fire('สำเร็จ', 'บันทึกข้อมูลเรียบร้อยแล้ว', 'success');
                
                // ล้างฟอร์ม (ลบค่าต่างๆ แทนการรีโหลดหน้าเว็บ)
                e.target.reset();
                document.getElementById('image_preview_container').classList.add('hidden');
                
                // โหลด Dashboard ใหม่เพื่ออัปเดตตัวเลข
                loadDashboard();

            } catch (error) {
                hideLoader();
                Swal.fire('ผิดพลาด', error.message || 'ไม่สามารถบันทึกได้', 'error');
            }
        }

        // ==========================================
        // 7. โหลดข้อมูล Dashboard
        // ==========================================
        async function loadDashboard() {
            try {
                // ดึงยอดรวม
                const { count: totalReports, error: err1 } = await dbClient.from('reports').select('*', { count: 'exact', head: true });
                // ดึงรายการล่าสุด
                const { data: recent, error: err2 } = await dbClient.from('reports').select('*').order('created_at', { ascending: false }).limit(3);

                if(err1 || err2) throw new Error("ดึงข้อมูล Dashboard ไม่สำเร็จ");

                document.getElementById('dash-total').innerText = totalReports || 0;
                document.getElementById('dash-farmers').innerText = totalReports || 0; // ในระบบจริงสามารถ distinct id_card ได้

                // แสดงรายการล่าสุด (และตัวอย่างการแสดง Error Message ของภาพ)
                const recentContainer = document.getElementById('recentRecords');
                if (recent.length > 0) {
                    recentContainer.innerHTML = recent.map(r => `
                        <div class="p-2 border-b last:border-0 flex justify-between items-center">
                            <div>
                                <p class="font-bold text-blue-600">${r.farmer_name}</p>
                                <p class="text-xs text-slate-500">${r.record_date} | ${r.visited_animals}</p>
                            </div>
                            ${r.image_1 
                                ? `<img src="${r.image_1}" class="w-10 h-10 rounded object-cover shadow" 
                                   onerror="this.onerror=null; this.outerHTML='<span class=\\'text-[10px] text-rose-500 bg-rose-50 px-1 rounded\\'>รูปเสีย</span>'">` 
                                : '<span class="text-xs text-slate-400">- ไม่มีรูป -</span>'}
                        </div>
                    `).join('');
                } else {
                    recentContainer.innerHTML = '-- ยังไม่มีข้อมูล --';
                }

            } catch(e) {
                console.error("Dashboard Error:", e);
            }
        }
    </script>
</body>
</html>
